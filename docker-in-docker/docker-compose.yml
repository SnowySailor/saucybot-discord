services:
  saucybot-dind:
    container_name: saucybot-dind
    privileged: true
    build:
      context: ..
      dockerfile: docker-in-docker/Dockerfile
    volumes:
      # Persists the inner daemon's images, build cache and volumes (including the database).
      - dind-storage:/var/lib/docker

volumes:
  dind-storage:
